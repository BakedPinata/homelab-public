; CouchDB settings for Obsidian Self-hosted LiveSync (from its setup_own_server.md).
; Mounted read-only into default.d; runtime changes (admin hash, uuid) go to local.d/docker.ini in appdata.
[couchdb]
single_node = true
max_document_size = 50000000

; One node, so one copy of each database (default 3 logs errors)
[cluster]
n = 1

[chttpd]
; Every request needs a login, except /_up (healthcheck)
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"

; The Obsidian apps call CouchDB from these origins
[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
