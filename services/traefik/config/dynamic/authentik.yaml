# Authentik forward auth. Add authentik@file to a router to put a sign-in page in front of it.
# The app's host also needs its /outpost.goauthentik.io/ path routed to Authentik (see services/authentik/README.md).
http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik_server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
