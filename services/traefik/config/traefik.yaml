# Traefik static config. Changes need a container restart.
# __DOMAIN__ is replaced with DOMAIN from .env when the container starts (compose.yaml entrypoint).
global:
  checkNewVersion: false   # Renovate handles updates
  sendAnonymousUsage: false
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: internal
          scheme: https
  internal:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 600s   # default 60s cuts off large uploads (Immich videos)
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: __DOMAIN__
            sans: ["*.__DOMAIN__"]
  # Internet traffic (UX7 forwards WAN 443 here). Routers on it must use public-chain@file.
  public:
    address: ":8443"
    transport:
      respondingTimeouts:
        readTimeout: 600s   # default 60s cuts off large uploads (Immich videos)
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: __DOMAIN__
            sans: ["*.__DOMAIN__"]

certificatesResolvers:
  cloudflare:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        # Ask public DNS, not AdGuard's split DNS, when checking the challenge record
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

providers:
  docker:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  plugins:
    crowdsec:   # CrowdSec bouncer, used by the crowdsec middleware in dynamic/public.yaml
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

api:
  dashboard: true
ping: {}
log:
  level: INFO
accessLog:
  filePath: /data/logs/access.log   # read by CrowdSec; rotated by logrotate (bootstrap-host.sh)
