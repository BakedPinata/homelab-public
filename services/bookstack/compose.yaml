# BookStack wiki with its own MariaDB.
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:v26.09.2-ls291
    container_name: bookstack
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_TIMEZONE=${TZ}
      - APP_KEY=${BOOKSTACK_APPKEY}
      - APP_URL=https://books.${DOMAIN}
      - ALLOWED_IFRAME_HOSTS=${BOOKSTACK_ALLOWED_IFRAME_HOSTS}
      - SESSION_LIFETIME=600
      - DB_HOST=bookstack_mariadb
      - DB_PORT=3306
      - DB_DATABASE=${BOOKSTACK_MARIADB_DATABASE}
      - DB_USERNAME=${BOOKSTACK_MARIADB_USER}
      - DB_PASSWORD=${BOOKSTACK_MARIADB_PASSWORD}
      - MAIL_DRIVER=smtp
      - MAIL_HOST=${BOOKSTACK_MAIL_HOST}
      - MAIL_PORT=${BOOKSTACK_MAIL_PORT}
      - MAIL_ENCRYPTION=tls
      - MAIL_USERNAME=${BOOKSTACK_MAIL_USERNAME}
      - MAIL_PASSWORD=${BOOKSTACK_MAIL_PASSWORD}
      - MAIL_FROM=${BOOKSTACK_MAIL_USERNAME}
      - MAIL_FROM_NAME=BookStack
      # Sign-in through Authentik (README). BOOKSTACK_AUTH_METHOD=standard brings back the password login.
      - AUTH_METHOD=${BOOKSTACK_AUTH_METHOD}
      - AUTH_AUTO_INITIATE=true
      - OIDC_NAME=Authentik
      - OIDC_DISPLAY_NAME_CLAIMS=name
      - OIDC_CLIENT_ID=${BOOKSTACK_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${BOOKSTACK_OIDC_CLIENT_SECRET}
      - OIDC_ISSUER=https://auth.${DOMAIN}/application/o/bookstack/
      - OIDC_ISSUER_DISCOVER=true
      - OIDC_END_SESSION_ENDPOINT=true   # signing out of BookStack also signs out of Authentik, or auto-initiate signs straight back in
      # Roles follow Authentik groups at every sign-in; roles no group matches are removed (README)
      - OIDC_USER_TO_GROUPS=true
      - OIDC_GROUPS_CLAIM=groups
      - OIDC_REMOVE_FROM_GROUPS=true
    volumes:
      - ${APPDATA}/bookstack/app:/config
    ports:
      - ${BOOKSTACK_PORT}:80
    depends_on:
      bookstack_mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bookstack.rule=Host(`books.${DOMAIN}`)
      - traefik.http.routers.bookstack.entrypoints=internal
      # Public: sign-in through Authentik (2FA there)
      - traefik.http.routers.bookstack-public.rule=Host(`books.${DOMAIN}`)
      - traefik.http.routers.bookstack-public.entrypoints=public
      - traefik.http.routers.bookstack-public.middlewares=public-chain@file
      # MFA setup refused on both entrypoints (Authentik does 2FA; BookStack has no switch). Sign-in checks and removal still work.
      - traefik.http.routers.bookstack-no-mfa.rule=Host(`books.${DOMAIN}`) && (PathPrefix(`/mfa/setup`) || PathPrefix(`/mfa/totp/generate`) || PathPrefix(`/mfa/totp/confirm`) || PathPrefix(`/mfa/backup_codes/generate`) || PathPrefix(`/mfa/backup_codes/confirm`))
      - traefik.http.routers.bookstack-no-mfa.entrypoints=internal,public
      - traefik.http.routers.bookstack-no-mfa.priority=1000
      - traefik.http.routers.bookstack-no-mfa.middlewares=bookstack-deny
      - traefik.http.routers.bookstack-no-mfa.service=bookstack
      - traefik.http.middlewares.bookstack-deny.ipallowlist.sourcerange=127.0.0.1/32   # no real client matches: always 403
      - traefik.http.services.bookstack.loadbalancer.server.port=80
    networks:
      - default
      - backend
      - proxy

  bookstack_mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.9-r0-ls237
    container_name: bookstack_mariadb
    restart: unless-stopped
    labels:
      - homelab.backup.db=true   # nightly dump by scripts/backup-db.sh
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Only applied when the database is first created
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${BOOKSTACK_MARIADB_DATABASE}
      - MYSQL_USER=${BOOKSTACK_MARIADB_USER}
      - MYSQL_PASSWORD=${BOOKSTACK_MARIADB_PASSWORD}
    volumes:
      - ${APPDATA}/bookstack/db:/config
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  # default: this stack's own network, with internet access
  backend:
    internal: true
  proxy:
    external: true
