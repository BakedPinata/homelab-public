# Media automation: downloads (nzbget), TV (sonarr), movies (radarr), requests (seerr).
services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:v26.3-ls267
    container_name: nzbget
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NZBGET_USER=${NZBGET_USERNAME}
      - NZBGET_PASS=${NZBGET_PASSWORD}
    volumes:
      - ${APPDATA}/media/nzbget:/config
      - ${PATH_TO_DOWNLOADS}:/downloads
    ports:
      - 6789:6789
    healthcheck:
      # 401 means it's up but wants a login
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:6789 | grep -qE '200|401'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.nzbget.rule=Host(`nzbget.${DOMAIN}`)
      - traefik.http.routers.nzbget.entrypoints=internal
      - traefik.http.services.nzbget.loadbalancer.server.port=6789
    networks:
      - default
      - proxy

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/sonarr:/config
      - ${PATH_TO_SERIES}:/tv
      - ${PATH_TO_DOWNLOADS}:/downloads
    ports:
      - 8989:8989
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=internal
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      - default
      - proxy

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls321
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/radarr:/config
      - ${PATH_TO_MOVIES}:/movies
      - ${PATH_TO_DOWNLOADS}:/downloads
    ports:
      - 7878:7878
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=internal
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    networks:
      - default
      - proxy

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/media/seerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.routers.seerr.entrypoints=internal
      # Public behind Authentik (browser-only app)
      - traefik.http.routers.seerr-public.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.routers.seerr-public.entrypoints=public
      - traefik.http.routers.seerr-public.middlewares=public-chain@file,authentik@file
      - traefik.http.routers.seerr-outpost.rule=Host(`seerr.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.seerr-outpost.entrypoints=public
      - traefik.http.routers.seerr-outpost.middlewares=public-chain@file
      - traefik.http.routers.seerr-outpost.service=authentik@docker
      - traefik.http.services.seerr.loadbalancer.server.port=5055
    networks:
      - default
      - proxy

networks:
  # default: this stack's own network, with internet access
  proxy:
    external: true
