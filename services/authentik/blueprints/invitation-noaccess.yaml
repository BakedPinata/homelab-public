# Invitation sign-up with no group: the invited person picks a username and password and
# is signed in, but can reach no app until you bind them (or add them to a group) by hand.
# Without an invitation link the flow stops.
version: 1
metadata:
  name: Homelab - Invitation noaccess
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Invitation shared
      required: true

  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: noaccess-enrollment
    attrs:
      name: Invitation (no access)
      title: Set up your account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: invitation-stage
    identifiers:
      name: noaccess-invitation
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_user_write.userwritestage
    id: user-write-stage
    identifiers:
      name: noaccess-user-write
    attrs:
      user_creation_mode: always_create
      user_type: internal

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf invitation-stage
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_prompt.promptstage, [name, invitation-prompt]]
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write-stage
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, invitation-user-login]]
      order: 100
