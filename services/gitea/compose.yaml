# Gitea: private git hosting, with its own Postgres. Rootless image: built-in SSH server, runs as uid 1000.
services:
  gitea:
    image: gitea/gitea:28.3.0-rootless
    container_name: gitea
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Written into app.ini at every start (environment-to-ini); the setup page writes the rest once
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_postgres:5432
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=git.${DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${DOMAIN}/
      - GITEA__server__SSH_DOMAIN=git.${DOMAIN}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT}   # shown in clone URLs: the host port
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true   # accounts only by the admin
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true    # nothing visible without signing in
      - GITEA__repository__DEFAULT_PRIVATE=private
      - GITEA__repository__ENABLE_PUSH_CREATE_USER=true   # `git push` to a new name creates a private repo
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=172.16.0.0/12   # Traefik: log real client IPs
    volumes:
      - ${APPDATA}/gitea/app:/var/lib/gitea   # repositories (git/repositories), attachments, LFS
      - ${APPDATA}/gitea/config:/etc/gitea    # app.ini, holds SECRET_KEY
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${GITEA_SSH_PORT}:2222   # git over SSH: LAN and Tailscale only, never port-forwarded
    depends_on:
      gitea_postgres:
        condition: service_healthy
    healthcheck:
      # Also answers on the first-run setup page, so the first deploy passes before setup is done
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)
      - traefik.http.routers.gitea.entrypoints=internal
      # Internal only. Going public: README
      - traefik.http.services.gitea.loadbalancer.server.port=3000
    networks:
      - default   # internet: migrating or mirroring repos from GitHub
      - backend
      - proxy

  gitea_postgres:
    image: postgres:18.6-alpine
    container_name: gitea_postgres
    restart: unless-stopped
    labels:
      - homelab.backup.db=true   # nightly dump by scripts/backup-db.sh
    environment:
      - POSTGRES_DB=${GITEA_DB_NAME}
      - POSTGRES_USER=${GITEA_DB_USER}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
    volumes:
      - ${APPDATA}/gitea/db:/var/lib/postgresql   # Postgres 18+ keeps data in <major>/docker under this
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  # default: this stack's own network, with internet access
  backend:
    internal: true
  proxy:
    external: true
