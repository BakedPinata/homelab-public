# Lets the Portainer server on the NAS see this host's containers. Look, logs and restart only: changes go through git.
services:
  portainer-agent:
    image: portainer/agent:3.0.0
    container_name: portainer_agent
    restart: unless-stopped
    # No healthcheck: the image has no shell or curl
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
